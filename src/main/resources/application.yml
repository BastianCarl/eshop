server:
  servlet:
    context-path: /api

spring:
  application:
    name: eShopProduct
  datasource:
    url: &db-url jdbc:postgresql://localhost:5432/eshopProduct
    username: postgres
    password: clashofclans
    driver-class-name: org.postgresql.Driver
  flyway: # migrations only
    url: *db-url
    user: migration_user
    password: migration_user
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: true