server:
  servlet:
    context-path: /api

spring:
  application:
    name: eShopNew
  datasource:
    url: jdbc:postgresql://localhost:5432/eshop
    username: migration_user
    password: migration_user
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: true